name: OpenSea WL Tracker

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: opensea-wl-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OpenSea tracker
        env:
          OPENSEA_WALLET1_PAT: ${{ secrets.OPENSEA_WALLET1_PAT }}
          OPENSEA_WALLET2_PAT: ${{ secrets.OPENSEA_WALLET2_PAT }}
          OPENSEA_SIRI_API_KEY: ${{ secrets.OPENSEA_SIRI_API_KEY }}
          OPENSEA_DHARAM_API_KEY: ${{ secrets.OPENSEA_DHARAM_API_KEY }}
          DISCORD_WEBHOOK_SIRI: ${{ secrets.DISCORD_WEBHOOK_SIRI }}
          DISCORD_WEBHOOK_DHARAM: ${{ secrets.DISCORD_WEBHOOK_DHARAM }}
        run: |
          node opensea-tracker.cjs

      - name: Save notification state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state/notified.json
          if git diff --cached --quiet; then
            echo "No notification state changes to commit."
          else
            git commit -m "Update OpenSea notification state"
            git push
          fi
